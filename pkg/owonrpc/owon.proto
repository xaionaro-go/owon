syntax = "proto3";

package xaionaro.owon;

option go_package = "github.com/xaionaro-go/owon/pkg/owonrpc/autogenerated";

import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service OwonService {
  rpc GetDeviceInfo(google.protobuf.Empty) returns (DeviceInfo);
  rpc GetState(GetStateRequest) returns (StateSnapshot);
  rpc Execute(ExecuteRequest) returns (ExecuteResponse);
  rpc SetChannel(SetChannelRequest) returns (CommandResult);
  rpc SetAcquisition(SetAcquisitionRequest) returns (CommandResult);
  rpc SetHorizontal(SetHorizontalRequest) returns (CommandResult);
  rpc SetTrigger(SetTriggerRequest) returns (CommandResult);
  rpc SetMeasurement(SetMeasurementRequest) returns (CommandResult);
  rpc SetGenerator(SetGeneratorRequest) returns (CommandResult);
  rpc SetDmm(SetDmmRequest) returns (CommandResult);
  rpc GetDmmMeasurement(google.protobuf.Empty) returns (DmmMeasurement);
  rpc Run(google.protobuf.Empty) returns (CommandResult);
  rpc Stop(google.protobuf.Empty) returns (CommandResult);
  rpc Single(google.protobuf.Empty) returns (CommandResult);
  // Source-backed V2.5.1 `:AUToseton` candidate; no device response/readback is claimed.
  rpc Auto(google.protobuf.Empty) returns (CommandResult);
  rpc GetWaveform(GetWaveformRequest) returns (Waveform);
  rpc Subscribe(SubscribeRequest) returns (stream Event);
}

enum Channel {
  CHANNEL_UNSPECIFIED = 0;
  CHANNEL_1 = 1;
  CHANNEL_2 = 2;
}

enum ResponseMode {
  RESPONSE_MODE_UNSPECIFIED = 0;
  RESPONSE_MODE_NONE = 1;
  RESPONSE_MODE_ASCII_LINE = 2;
  RESPONSE_MODE_OWON_LENGTH_PREFIXED = 3;
}

enum Coupling {
  COUPLING_UNSPECIFIED = 0;
  COUPLING_AC = 1;
  COUPLING_DC = 2;
  COUPLING_GROUND = 3;
}

enum AcquisitionMode {
  ACQUISITION_MODE_UNSPECIFIED = 0;
  ACQUISITION_MODE_SAMPLE = 1;
  ACQUISITION_MODE_PEAK_DETECT = 2;
  ACQUISITION_MODE_AVERAGE = 3;
}

enum AcquisitionMemoryDepth {
  ACQUISITION_MEMORY_DEPTH_UNSPECIFIED = 0;
  ACQUISITION_MEMORY_DEPTH_4K = 1;
  ACQUISITION_MEMORY_DEPTH_8K = 2;
}

enum TriggerSource {
  TRIGGER_SOURCE_UNSPECIFIED = 0;
  TRIGGER_SOURCE_CHANNEL_1 = 1;
  TRIGGER_SOURCE_CHANNEL_2 = 2;
  TRIGGER_SOURCE_EXTERNAL = 3;
}

enum TriggerSlope {
  TRIGGER_SLOPE_UNSPECIFIED = 0;
  TRIGGER_SLOPE_RISING = 1;
  TRIGGER_SLOPE_FALLING = 2;
}

enum TriggerSweep {
  TRIGGER_SWEEP_UNSPECIFIED = 0;
  TRIGGER_SWEEP_AUTO = 1;
  TRIGGER_SWEEP_NORMAL = 2;
  TRIGGER_SWEEP_SINGLE = 3;
}

enum MeasurementKind {
  MEASUREMENT_KIND_UNSPECIFIED = 0;
  MEASUREMENT_KIND_UNKNOWN = 1;
  MEASUREMENT_KIND_MAXIMUM = 2;
  MEASUREMENT_KIND_MINIMUM = 3;
  MEASUREMENT_KIND_PEAK_TO_PEAK = 4;
  MEASUREMENT_KIND_AMPLITUDE = 5;
  MEASUREMENT_KIND_AVERAGE = 6;
  MEASUREMENT_KIND_PERIOD = 7;
  MEASUREMENT_KIND_FREQUENCY = 8;
}

enum GeneratorWaveform {
  // Vendor-documented tokens; software serialization tests do not prove physical SET acceptance.
  GENERATOR_WAVEFORM_UNSPECIFIED = 0;
  GENERATOR_WAVEFORM_SINE = 1;
  GENERATOR_WAVEFORM_SQUARE = 2;
  GENERATOR_WAVEFORM_RAMP = 3;
  GENERATOR_WAVEFORM_PULSE = 4;
  GENERATOR_WAVEFORM_AMP_ALT = 5;
  GENERATOR_WAVEFORM_ATT_ALT = 6;
  GENERATOR_WAVEFORM_STAIR_DOWN = 7;
  GENERATOR_WAVEFORM_STAIR_UP_DOWN = 8;
  GENERATOR_WAVEFORM_STAIR_UP = 9;
  GENERATOR_WAVEFORM_BESSEL_J = 10;
  GENERATOR_WAVEFORM_BESSEL_Y = 11;
  GENERATOR_WAVEFORM_SINC = 12;
}

enum DmmFunction {
  DMM_FUNCTION_UNSPECIFIED = 0;
  DMM_FUNCTION_VOLTAGE = 1;
  DMM_FUNCTION_CURRENT = 2;
  DMM_FUNCTION_RESISTANCE = 3;
  DMM_FUNCTION_CAPACITANCE = 4;
  DMM_FUNCTION_DIODE = 5;
  DMM_FUNCTION_CONTINUITY = 6;
}

enum GeneratorLoad {
  GENERATOR_LOAD_UNSPECIFIED = 0;
  GENERATOR_LOAD_ON = 1;
  GENERATOR_LOAD_OFF = 2;
}

enum GeneratorObservationStatus {
  GENERATOR_OBSERVATION_UNSPECIFIED = 0;
  GENERATOR_OBSERVATION_OBSERVED = 1;
  GENERATOR_OBSERVATION_UNVERIFIED = 2;
  GENERATOR_OBSERVATION_UNAVAILABLE = 3;
  GENERATOR_OBSERVATION_MALFORMED = 4;
  GENERATOR_OBSERVATION_UNKNOWN = 5;
}

enum GeneratorContextStatus {
  GENERATOR_CONTEXT_UNSPECIFIED = 0;
  GENERATOR_CONTEXT_MATCH = 1;
  GENERATOR_CONTEXT_MISMATCH = 2;
  GENERATOR_CONTEXT_UNKNOWN = 3;
}

enum GeneratorDeliveryStatus {
  GENERATOR_DELIVERY_NOT_ATTEMPTED = 0;
  GENERATOR_DELIVERY_TRANSPORT_COMPLETE_READBACK_VERIFIED = 1;
  GENERATOR_DELIVERY_TRANSPORT_COMPLETE_READBACK_UNVERIFIED = 2;
  GENERATOR_DELIVERY_PARTIAL_OR_UNKNOWN = 3;
}

enum GeneratorOutputCompensationStatus {
  GENERATOR_OUTPUT_COMPENSATION_NOT_ATTEMPTED = 0;
  GENERATOR_OUTPUT_COMPENSATION_NOT_REQUIRED = 1;
  GENERATOR_OUTPUT_COMPENSATION_VERIFIED = 2;
  GENERATOR_OUTPUT_COMPENSATION_UNVERIFIED = 3;
  GENERATOR_OUTPUT_COMPENSATION_FAILED = 4;
}

enum DmmRange {
  DMM_RANGE_UNSPECIFIED = 0;
  DMM_RANGE_ON = 1;
  DMM_RANGE_MV = 2;
  DMM_RANGE_V = 3;
}

enum DmmCurrentType {
  DMM_CURRENT_TYPE_UNSPECIFIED = 0;
  DMM_CURRENT_TYPE_AC = 1;
  DMM_CURRENT_TYPE_DC = 2;
}

enum Capability {
  CAPABILITY_UNSPECIFIED = 0;
  CAPABILITY_OSCILLOSCOPE = 1;
  CAPABILITY_WAVEFORM_GENERATOR = 2;
  CAPABILITY_MULTIMETER = 3;
  CAPABILITY_SCREEN_WAVEFORM = 4;
}

enum ServiceErrorCategory {
  SERVICE_ERROR_CATEGORY_UNSPECIFIED = 0;
  SERVICE_ERROR_CATEGORY_INVALID_REQUEST = 1;
  SERVICE_ERROR_CATEGORY_UNSUPPORTED = 2;
  SERVICE_ERROR_CATEGORY_DEVICE_UNAVAILABLE = 3;
  SERVICE_ERROR_CATEGORY_PROTOCOL = 4;
  SERVICE_ERROR_CATEGORY_BACKPRESSURE = 5;
}

message DeviceSelector {
  uint32 vendor_id = 1;
  uint32 product_id = 2;
  string serial = 3;
}

message DeviceInfo {
  string manufacturer = 1;
  string model = 2;
  string serial = 3;
  string firmware = 4;
  uint32 vendor_id = 5;
  uint32 product_id = 6;
  repeated Capability capabilities = 7;
}

message GetStateRequest {
  repeated MeasurementSelector measurements = 1;
  bool include_screen_header = 2;
  bool include_controls = 3;
}

message MeasurementSelector {
  Channel channel = 1;
  MeasurementKind kind = 2;
}

message Measurement {
  Channel channel = 1;
  MeasurementKind kind = 2;
  double value = 3;
  string unit = 4;
  string raw = 5;
}

message ChannelState {
  Channel channel = 1;
  bool display = 2;
  Coupling coupling = 3;
  double probe_attenuation = 4;
  string scale = 5;
  // Unconverted screen-header OFFSET; units and conversion to write divisions are undocumented.
  // Omitted when the header does not report the field.
  optional double screen_header_offset = 6;
}

message AcquisitionState {
  AcquisitionMode mode = 1;
  // Omitted when the verified device response does not report an averaging count.
  optional uint32 average_count = 2;
  // Raw screen-header depth token, not constrained by the writable selector.
  string memory_depth = 3;
}

message HorizontalState {
  string scale = 1;
  // Unconverted screen-header HOFFSET; units and conversion to write divisions are undocumented.
  // Omitted when the header does not report the field.
  optional double screen_header_offset = 2;
}

message TriggerState {
  TriggerSource source = 1;
  Coupling coupling = 2;
  TriggerSlope slope = 3;
  double level = 4;
  TriggerSweep sweep = 5;
  string status = 6;
}

message GeneratorState {
  // Queries exist, but no complete validated mapping populates this typed state.
  GeneratorWaveform waveform = 1;
  double frequency_hz = 2;
  double period_seconds = 3;
  // Amplitude in volts peak-to-peak (Vpp).
  double amplitude_volts = 4;
  double offset_volts = 5;
  double high_volts = 6;
  double low_volts = 7;
  // The documented query representation is floating point, unlike integer writes.
  double symmetry_percent = 8;
  double pulse_width_seconds = 9;
  double rising_seconds = 10;
  double falling_seconds = 11;
  double duty_percent = 12;
  GeneratorLoad load = 13;
  bool output = 14;
}

message DmmState {
  DmmFunction function = 1;
  DmmCurrentType current_type = 2;
  bool relative = 3;
  DmmRange range = 4;
  bool auto_range = 5;
  string observed_range_token = 6;
}

message StateSnapshot {
  DeviceInfo device = 1;
  repeated Measurement measurements = 2;
  bytes screen_header_json = 3;
  google.protobuf.Timestamp captured_at = 4;
  repeated ChannelState channels = 5;
  AcquisitionState acquisition = 6;
  HorizontalState horizontal = 7;
  TriggerState trigger = 8;
  // Omitted until a complete generator query-to-state mapping is validated.
  GeneratorState generator = 9;
  // Only verified DMM range readback is populated; other dimensions remain unspecified.
  DmmState dmm = 10;
}

message ExecuteRequest {
  string command = 1;
  ResponseMode response_mode = 2;
}

message ExecuteResponse {
  bytes data = 1;
}

message CommandResult {
  // Transport completion only; this timestamp is not device readback.
  google.protobuf.Timestamp applied_at = 1;
  GeneratorOperationResult generator = 2;
}

message GeneratorWaveformContext {
  optional GeneratorWaveform requested = 1;
  optional GeneratorWaveform observed = 2;
  string observed_token = 3;
  GeneratorContextStatus match = 4;
  string observed_raw = 5;
  string reason = 6;
}

message GeneratorOutputObservation {
  GeneratorObservationStatus status = 1;
  optional bool value = 2;
  string token = 3;
  string raw = 4;
  string reason = 5;
}

message GeneratorObservation {
  google.protobuf.Timestamp captured_at = 1;
  GeneratorWaveformContext context = 2;
  GeneratorOutputObservation output = 3;
}

message GeneratorOutputCompensation {
  optional bool requested = 1;
  optional bool observed = 2;
  GeneratorOutputCompensationStatus status = 3;
}

message GeneratorOperationResult {
  GeneratorDeliveryStatus delivery = 1;
  GeneratorObservation observation = 2;
  repeated string completed_writes = 3;
  GeneratorOutputCompensation compensation = 4;
}

message SetChannelRequest {
  Channel channel = 1;
  optional bool display = 2;
  optional Coupling coupling = 3;
  optional double probe_attenuation = 4;
  optional string scale = 5;
  // Whole divisions for :CH<n>:OFFSET, in the documented range [-200, 200].
  optional int64 offset_divisions = 6;
  optional bool bandwidth_limit = 7;
  optional bool inversion = 8;
}

message SetAcquisitionRequest {
  optional AcquisitionMode mode = 1;
  optional uint32 average_count = 2;
  optional AcquisitionMemoryDepth memory_depth = 3;
}

message SetHorizontalRequest {
  optional string scale = 1;
  // Whole divisions for :HORIZONTAL:OFFSET; no fixed numeric range is documented.
  optional int64 offset_divisions = 2;
}

message SetTriggerRequest {
  optional TriggerSource source = 1;
  optional Coupling coupling = 2;
  optional TriggerSlope slope = 3;
  optional double level_volts = 4;
  optional TriggerSweep sweep = 5;
}

message SetMeasurementRequest {
  optional bool display = 1;
  repeated MeasurementSelector visible = 2;
  optional bool replace_visible = 3;
}

message SetGeneratorRequest {
  // Retained vendor/transcribed grammar, not physical SET proof; see docs/usb-protocol.md.
  // Duty/rise/fall interpretation remains uncertain. Execute permits explicitly framed raw queries.
  // Required with frequency, period, symmetry, duty, width, rising or falling.
  // The typed API does not support symmetry, duty, width, rising or falling for builtins.
  // Their builtin interpretation has not been verified on the device.
  optional GeneratorWaveform waveform = 1;
  // Frequency and period are mutually exclusive, even when reciprocal.
  optional double frequency_hz = 2;
  optional double period_seconds = 3;
  // Amplitude in volts peak-to-peak (Vpp).
  optional double amplitude_volts = 4;
  optional double offset_volts = 5;
  optional double high_volts = 6;
  optional double low_volts = 7;
  optional int32 symmetry_percent = 8;
  optional double pulse_width_seconds = 9;
  optional double rising_seconds = 10;
  optional double falling_seconds = 11;
  optional double duty_percent = 12;
  optional GeneratorLoad load = 13;
  optional bool output = 14;
  // WebUI and explicit clients may request the bounded observed result; omitted keeps legacy write-only semantics.
  optional bool observe = 15;
}

message SetDmmRequest {
  optional DmmFunction function = 1;
  optional DmmCurrentType current_type = 2;
  optional bool relative = 3;
  optional DmmRange range = 4;
  optional bool auto_range = 5;
}

message DmmMeasurement {
  // Omitted because the verified :DMM:MEAS? reply does not identify its function.
  optional DmmFunction function = 1;
  double value = 2;
  string unit = 3;
  string raw = 4;
  google.protobuf.Timestamp captured_at = 5;
}

message GetWaveformRequest {
  Channel channel = 1;
  // Must be true; non-screen waveform framing has not been verified.
  bool screen = 2;
}

message WaveformMetadata {
  // Omitted until the raw sample encoding and sample count are verified.
  optional uint64 sample_count = 1;
  double sample_rate_hz = 2;
  string sample_encoding = 3;
  optional double x_origin_seconds = 4;
  optional double x_increment_seconds = 5;
  optional double y_origin_volts = 6;
  optional double y_increment_volts = 7;
  // Exact raw waveform payload length returned by the device.
  uint64 data_length_bytes = 8;
}

// Vendor display coordinates, not calibrated ADC samples. X is the Y array index.
// Coordinates use a top-left origin; off-screen values are retained for clipping.
message ScreenTrace {
  string profile = 1;
  uint32 width = 2;
  uint32 height = 3;
  uint32 horizontal_divisions = 4;
  uint32 vertical_divisions = 5;
  repeated sint32 y = 6;
  sint32 ground_y = 7;
}

message Waveform {
  Channel channel = 1;
  bytes data = 2;
  string encoding = 3;
  bytes screen_header_json = 4;
  // Per-channel capture sequence within one subscription; zero for unary calls.
  uint64 sequence = 5;
  google.protobuf.Timestamp captured_at = 6;
  WaveformMetadata metadata = 7;
  ScreenTrace screen_trace = 8;
  string screen_trace_unavailable_reason = 9;
  // Host I/O start before HEAD, not a device acquisition timestamp.
  google.protobuf.Timestamp capture_started_at = 10;
}

message SubscribeRequest {
  google.protobuf.Duration interval = 1;
  repeated MeasurementSelector measurements = 2;
  repeated Channel waveform_channels = 3;
  bool include_screen_header = 4;
  // Ordinary event capacity; zero selects the default and the maximum is 1024.
  uint32 queue_capacity = 5;
  bool include_controls = 6;
}

message WaveformGap {
  Channel channel = 1;
  uint64 first_missing_sequence = 2;
  uint64 missing_count = 3;
  uint64 last_missing_sequence = 4;
}

message ServiceError {
  string operation = 1;
  string message = 2;
  bool retryable = 3;
  ServiceErrorCategory category = 4;
}

message Event {
  google.protobuf.Timestamp timestamp = 1;
  oneof payload {
    StateSnapshot state = 2;
    Waveform waveform = 3;
    WaveformGap waveform_gap = 4;
    ServiceError error = 5;
  }
  // Monotonic FIFO publication sequence for this subscription.
  uint64 sequence = 6;
}
